# Daily job-board refresh. Lives in the public site repo (unicorn-radar-site), where
# deploy.sh copies it with the pipeline code: public repos get unlimited Actions minutes
# and GITHUB_TOKEN can push to the same repo, so no secrets are needed.
name: daily-jobs
on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC / 06:00 IST
  workflow_dispatch:
concurrency: { group: daily-jobs, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: scan boards + publish jobs
        run: |
          pip install -q certifi
          mkdir -p pipeline/cache && cp -f state/* pipeline/cache/ 2>/dev/null || true
          ln -sfn .. pipeline/web            # the repo root *is* the site
          python3 pipeline/features.py
          python3 -u pipeline/jobs.py --workers 12
          cp -f pipeline/cache/ledger.json.gz pipeline/cache/history.json pipeline/cache/boards.json state/
          rm pipeline/web
      - name: publish (single orphan commit — data churns daily, history would only bloat)
        run: |
          git config user.name "unicorn-radar bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A && git commit -qm "daily jobs $(date -u +%F)"
          git push -f origin fresh:main
